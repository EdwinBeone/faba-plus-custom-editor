[package]
name = "faba-plus-custom-editor"
version = "0.3.0"
description = "A friendly cross-platform desktop editor for FABA+ microSD cards"
authors = ["EdwinBeone"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/EdwinBeone/faba-plus-custom-editor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "faba_plus_custom_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sysinfo = "0.39.6"
id3 = "1.17.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "system-proxy"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
